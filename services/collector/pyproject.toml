[project]
name = "pulse-collector"
version = "0.1.0"
description = "Edge event collector: authenticates, validates and durably produces events to Kafka as Avro."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.16,<3",
    "fastapi>=0.143,<1",
    "orjson>=3.13",
    "prometheus-client>=0.26",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true
