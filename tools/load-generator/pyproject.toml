[project]
name = "pulse-load-generator"
version = "0.1.0"
description = "Simulated shoppers that drive realistic traffic (and controlled chaos) through the platform."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.16,<3",
    "httpx>=0.28",
    "pydantic-settings>=2.15,<3",
]

[project.scripts]
load-generator = "load_generator.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/load_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
