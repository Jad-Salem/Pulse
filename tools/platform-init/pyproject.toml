[project]
name = "pulse-platform-init"
version = "0.1.0"
description = "Idempotent bootstrap: Kafka topics, schema registration, ClickHouse migrations, catalog seed."
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.10,<2",
    "confluent-kafka[avro,schemaregistry]>=2.16,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
platform-init = "platform_init.__main__:main"

[dependency-groups]
dev = [
    "fastavro>=1.13",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_init"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "fastavro.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The package re-exports its admin types without __all__.
module = ["confluent_kafka.admin"]
implicit_reexport = true
