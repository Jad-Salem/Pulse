# Alerting rules: symptoms first (is data flowing, is it fresh), then causes.
groups:
  - name: pulse-ingestion
    rules:
      - alert: CollectorDown
        expr: up{job="collector"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Collector is not responding to scrapes; events cannot be ingested.

      - alert: CollectorProduceFailures
        expr: sum(rate(collector_events_rejected_total{reason="unavailable"}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: The collector is returning 503s because Kafka is not acknowledging writes.

      - alert: CollectorSlowAcks
        expr: histogram_quantile(0.99, sum by (le) (rate(collector_produce_latency_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: p99 time to a Kafka acknowledgement is above 500 ms.

  - name: pulse-processing
    rules:
      - alert: StreamProcessorNotRunning
        expr: max(flink_jobmanager_numRunningJobs) < 1 or absent(flink_jobmanager_numRunningJobs)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The Flink job is not running; enriched events, sessions and alerts have stopped.

      - alert: StreamProcessorRestarting
        expr: increase(flink_jobmanager_job_numRestarts[10m]) > 2
        labels: {severity: warning}
        annotations:
          summary: The Flink job restarted more than twice in 10 minutes.

      - alert: CheckpointsFailing
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Checkpoints are failing. Exactly-once output is only committed on a successful checkpoint, so results will stall.

      - alert: DeadLettersElevated
        expr: >
          sum(rate(flink_taskmanager_job_task_operator_deadLettersDecode[5m]))
          + sum(rate(flink_taskmanager_job_task_operator_deadLettersValidation[5m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 1 record/s is going to the dead-letter topic. Inspect pulse.dead_letters.

  - name: pulse-freshness
    rules:
      - alert: ConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag) > 10000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is more than 10k records behind."
