global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: collector
    static_configs: [{targets: ["collector:8000"]}]

  - job_name: query-api
    static_configs: [{targets: ["query-api:8000"]}]

  - job_name: flink-jobmanager
    static_configs: [{targets: ["jobmanager:9249"]}]

  # Every taskmanager replica, discovered through Docker's DNS (one A record per container).
  - job_name: flink-taskmanager
    dns_sd_configs:
      - names: ["taskmanager"]
        type: A
        port: 9249

  - job_name: clickhouse
    static_configs: [{targets: ["clickhouse:9363"]}]

  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
